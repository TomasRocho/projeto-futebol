[project]
name = "projeto-futebol"
version = "0.1.0"
description = "API para organizar a pelada: sorteio de times, rodízio, placar e estatísticas"
authors = [{ name = "Tomas Garcia Rocho", email = "tomasgarciarocho@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "sqlmodel>=0.0.22",
    "pydantic-settings>=2.6",
]

[tool.poetry]
package-mode = false

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
